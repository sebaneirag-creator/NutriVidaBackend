spring.application.name=servicios
server.port=8080

# --- Base de datos (usa variables de entorno; los valores tras ":" son solo para desarrollo local) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nutrivida?createDatabaseIfNotExist=true'}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- Flyway crea el esquema; Hibernate solo lo valida ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT (se usa desde el paso 4). JWT_SECRET: minimo 32 caracteres, NUNCA en GitHub ---
app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutos=30
app.jwt.refresh-dias=7

# --- CORS: origen del frontend (Vite) ---
app.cors.origen=${CORS_ORIGEN:http://localhost:5173}
